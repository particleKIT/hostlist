[build-system]
requires = ["flit_core >=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hostlist"
authors = [{name = "Robin Roth", email = "robin.roth@kit.edu"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"
dependencies = [
    "PyYAML",
    "termcolor",
    "requests",
    "cherrypy",
    "GitPython",
    "ansible-cmdb",
    "zombie-imp; python_version >= '3.12'",
]
dynamic = ["version", "description"]

[project.urls]
Home = "https://github.com/particlekit/hostlist"

[project.scripts]
buildfiles = "hostlist.buildfiles:main"
addhost = "hostlist.addhost:main"
hostlist-daemon = "hostlist.daemon:main"